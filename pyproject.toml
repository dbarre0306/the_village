[project]
name = "the_village"
version = "0.1.0"
description = "the_village using crewAI"
authors = [{ name = "Donald Barre", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.16,<2.0.0",
    "gradio>=6.24.0",
]

[project.scripts]
kickoff = "the_village.village_flow:kickoff"
run_crew = "the_village.village_flow:kickoff"
plot = "the_village.village_flow:plot"
app = "the_village.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: hits a real LLM (slow, costs tokens); run explicitly with -m integration",
]

[tool.crewai]
type = "flow"
project_id = "981d9c72-8027-4962-b017-a879533e5883"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]
